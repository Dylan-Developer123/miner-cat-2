<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Highway Pursuit 3D — Arqade</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #07070f; color: #eef; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 14px; overflow-x: hidden; }
  a.exit-game { display: inline-flex; align-items: center; align-self: flex-start; background: #101828; color: #dcefe2; border: 1px solid #3b4b3f; border-radius: 9px; padding: 8px 14px; font-size: 15px; font-weight: 700; line-height: 1; text-decoration: none; }
  h1 { font-size: 25px; margin: 8px 0 2px; letter-spacing: 1px; }
  h1 .red { color: #f87171; } h1 .blue { color: #60a5fa; }
  #hud { width: min(680px, 95vw); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-family: 'Courier New', monospace; font-size: 15px; margin: 6px 0 8px; }
  #stars { color: #f5c542; letter-spacing: 2px; font-size: 17px; }
  .bar { flex: 1 1 130px; min-width: 120px; }
  .bar label { font-size: 11px; letter-spacing: 1px; opacity: .85; display: block; }
  .track { height: 12px; background: #26263a; border-radius: 6px; overflow: hidden; border: 1px solid #44445e; }
  .fill { height: 100%; width: 0%; transition: width .12s; }
  #bust-fill { background: linear-gradient(90deg, #3b82f6, #ef4444); }
  #dmg-fill { background: linear-gradient(90deg, #22c55e, #eab308, #ef4444); width: 100%; }
  #stage { position: relative; width: min(680px, 95vw); }
  #game3d canvas { display: block; width: 100%; height: auto; border-radius: 12px; border: 2px solid #2b2b45; }
  #flashmsg { position: absolute; top: 12px; left: 0; right: 0; text-align: center; font-size: 24px; font-weight: 800; color: #fde68a; text-shadow: 0 2px 8px #000; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #msg { margin-top: 10px; font-size: 16px; min-height: 22px; text-align: center; }
  .touch { display: flex; gap: 10px; margin-top: 10px; }
  .touch button { background: #26264a; color: #eee; border: 1px solid #55557a; font-weight: bold; padding: 14px 20px; border-radius: 10px; font-size: 17px; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; }
  button.action { margin-top: 10px; background: #e11d48; color: #fff; border: none; font-weight: bold; padding: 11px 24px; border-radius: 9px; font-size: 16px; cursor: pointer; }
  #acct { margin-top: 14px; font-size: 14px; opacity: .9; }
  #lb { margin-top: 10px; font-size: 14px; text-align: left; min-width: 250px; }
</style>
</head>
<body>
<a class="exit-game" href="/">← All games</a>
<h1>🚓 HIGHWAY <span class="red">PURSUIT</span> <span class="blue">3D</span></h1>
<div id="hud">
  <span>🏁 <b id="h-score">0</b></span>
  <span>💨 <b id="h-speed">0</b> mph</span>
  <span id="stars">★☆☆☆☆</span>
  <div class="bar"><label>🚨 BUST METER</label><div class="track"><div class="fill" id="bust-fill"></div></div></div>
  <div class="bar"><label>🔧 CAR HEALTH</label><div class="track"><div class="fill" id="dmg-fill"></div></div></div>
</div>
<div id="stage">
  <div id="game3d"></div>
  <div id="flashmsg"></div>
</div>
<div id="msg">Weave through traffic — but the cops are coming. Don't let them box you in!</div>
<div class="touch">
  <button id="t-left">◀</button>
  <button id="t-boost">💨 BOOST</button>
  <button id="t-brake">🛑 BRAKE</button>
  <button id="t-right">▶</button>
</div>
<button class="action" id="restart">▶ Start chase</button>
<div id="acct"></div>
<div id="lb"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $ = id => document.getElementById(id);
if (!window.THREE) { $('msg').textContent = '⚠️ The 3D library could not load — check your connection and refresh.'; }
// ---------- tuning ----------
const ROAD_HALF = 13.5;
const LANES = [-10.1, -3.4, 3.4, 10.1];
const CRUISE = 34, BOOST = 58, BRAKE = 15;
// ---------- state ----------
let state = 'wait', keys = {}, scorePts = 0, dist = 0, speed = 0, elapsed = 0, wanted = 0, bust = 0, damage = 0;
let traffic = [], cops = [], props = [], trafficTimer = 0, submitted = false, shake = 0, flashT = 0;
let scene, camera, renderer, player, roadTex, clock;
// ---------- world ----------
function makeCar(color, opts = {}) {
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshLambertMaterial({ color });
  const body = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.55, 4.3), bodyMat);
  body.position.y = 0.55; g.add(body);
  const hood = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.3, 1.0), bodyMat);
  hood.position.set(0, 0.72, -1.85); g.add(hood);
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.52, 2.0), new THREE.MeshLambertMaterial({ color: opts.cabinColor !== undefined ? opts.cabinColor : 0x18222e }));
  cabin.position.set(0, 1.06, 0.15); g.add(cabin);
  const wheelGeo = new THREE.CylinderGeometry(0.37, 0.37, 0.3, 10);
  const wheelMat = new THREE.MeshLambertMaterial({ color: 0x0a0a0a });
  for (const [wx, wz] of [[-0.95, -1.45], [0.95, -1.45], [-0.95, 1.45], [0.95, 1.45]]) {
    const w = new THREE.Mesh(wheelGeo, wheelMat);
    w.rotation.z = Math.PI / 2; w.position.set(wx, 0.37, wz); g.add(w);
  }
  const lightMat = new THREE.MeshBasicMaterial({ color: 0xfde68a });
  for (const sx of [-0.6, 0.6]) {
    const h = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.16, 0.06), lightMat);
    h.position.set(sx, 0.62, -2.17); g.add(h);
    const t = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.16, 0.06), new THREE.MeshBasicMaterial({ color: 0xef4444 }));
    t.position.set(sx, 0.62, 2.17); g.add(t);
  }
  if (opts.spoiler) {
    const sp = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.1, 0.4), new THREE.MeshLambertMaterial({ color: 0x111111 }));
    sp.position.set(0, 1.05, 2.0); g.add(sp);
  }
  if (opts.cop) {
    const bar = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.14, 0.55), new THREE.MeshLambertMaterial({ color: 0x222222 }));
    bar.position.set(0, 1.42, 0.15); g.add(bar);
    const red = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.2, 0.5), new THREE.MeshBasicMaterial({ color: 0xff2222 }));
    red.position.set(-0.38, 1.44, 0.15); g.add(red);
    const blue = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.2, 0.5), new THREE.MeshBasicMaterial({ color: 0x2266ff }));
    blue.position.set(0.38, 1.44, 0.15); g.add(blue);
    g.userData.red = red; g.userData.blue = blue;
    const stripe = new THREE.Mesh(new THREE.BoxGeometry(2.04, 0.3, 4.34), new THREE.MeshLambertMaterial({ color: 0xf8fafc }));
    stripe.position.y = 0.42; stripe.scale.set(1, 0.45, 1); g.add(stripe);
  }
  return g;
}
function roadTexture() {
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 256;
  const x = cv.getContext('2d');
  x.fillStyle = '#33373d'; x.fillRect(0, 0, 256, 256);
  x.fillStyle = '#3c4147';
  for (let i = 0; i < 300; i++) x.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);
  x.fillStyle = '#f8fafc'; x.fillRect(4, 0, 5, 256); x.fillRect(247, 0, 5, 256);
  x.fillStyle = '#facc15';
  for (const lx of [64, 128, 192]) x.fillRect(lx - 3, 18, 6, 92);
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(1, 10);
  return tex;
}
function buildWorld() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b1026);
  scene.fog = new THREE.Fog(0x0b1026, 55, 215);
  camera = new THREE.PerspectiveCamera(68, 680 / 440, 0.1, 600);
  camera.position.set(0, 5.4, 10.5);
  camera.lookAt(0, 1, -12);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(680, 440);
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  $('game3d').appendChild(renderer.domElement);
  scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x1a2410, 0.85));
  const sun = new THREE.DirectionalLight(0xffd9a0, 0.75);
  sun.position.set(-30, 50, -40); scene.add(sun);
  // sunset band
  const sky = new THREE.Mesh(new THREE.PlaneGeometry(600, 90), new THREE.MeshBasicMaterial({ color: 0x3b2f4f }));
  sky.position.set(0, 32, -230); scene.add(sky);
  const sunset = new THREE.Mesh(new THREE.PlaneGeometry(600, 16), new THREE.MeshBasicMaterial({ color: 0xb45309 }));
  sunset.position.set(0, 7, -229); scene.add(sunset);
  // road
  roadTex = roadTexture();
  const road = new THREE.Mesh(new THREE.PlaneGeometry(30, 420), new THREE.MeshLambertMaterial({ map: roadTex }));
  road.rotation.x = -Math.PI / 2; road.position.z = -180; scene.add(road);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 420), new THREE.MeshLambertMaterial({ color: 0x16280f }));
  ground.rotation.x = -Math.PI / 2; ground.position.set(0, -0.05, -180); scene.add(ground);
  // roadside props
  for (let i = 0; i < 44; i++) {
    let m;
    if (i % 3 === 0) { // streetlight
      m = new THREE.Group();
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 5.4), new THREE.MeshLambertMaterial({ color: 0x4b5563 }));
      pole.position.y = 2.7; m.add(pole);
      const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.32, 8, 8), new THREE.MeshBasicMaterial({ color: 0xfde68a }));
      lamp.position.y = 5.5; m.add(lamp);
    } else if (i % 3 === 1) { // building block
      const hgt = 6 + Math.random() * 16;
      m = new THREE.Mesh(new THREE.BoxGeometry(7 + Math.random() * 5, hgt, 7), new THREE.MeshLambertMaterial({ color: [0x1f2937, 0x273549, 0x312e45][i % 3] }));
      m.position.y = hgt / 2;
    } else { // tree cone
      m = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.3, 1.6), new THREE.MeshLambertMaterial({ color: 0x3f2d20 }));
      trunk.position.y = 0.8; m.add(trunk);
      const top = new THREE.Mesh(new THREE.ConeGeometry(1.7, 4.4, 7), new THREE.MeshLambertMaterial({ color: 0x1d4d24 }));
      top.position.y = 3.8; m.add(top);
    }
    const side = i % 2 ? 1 : -1;
    m.position.set(side * (19 + Math.random() * 14), 0, -Math.random() * 400 + 10);
    scene.add(m); props.push(m);
  }
  // player
  player = makeCar(0xe11d48, { spoiler: true, cabinColor: 0x111827 });
  player.position.set(0, 0, 0);
  scene.add(player);
  clock = new THREE.Clock();
}
function spawnTraffic() {
  const lane = LANES[Math.floor(Math.random() * LANES.length)];
  if (traffic.some(t => Math.abs(t.position.x - lane) < 3 && t.position.z < -150)) return;
  const colors = [0x3b82f6, 0xa855f7, 0xf59e0b, 0x10b981, 0xe5e7eb, 0x64748b];
  const car = makeCar(colors[Math.floor(Math.random() * colors.length)]);
  car.position.set(lane, 0, -190 - Math.random() * 30);
  car.userData.speed = 13 + Math.random() * 9;
  car.userData.passed = false;
  car.userData.changeT = 3 + Math.random() * 7;
  car.userData.targetX = lane;
  scene.add(car); traffic.push(car);
}
function spawnCop() {
  const cop = makeCar(0x111827, { cop: true });
  cop.position.set(player.position.x + (Math.random() * 6 - 3), 0, 15 + cops.length * 7);
  cop.userData.aggro = 0.9 + Math.random() * 0.35;
  scene.add(cop); cops.push(cop);
  flash('🚨 THE COPS ARE ON YOU!');
  $('msg').textContent = '🚨 Police pursuit! Keep moving — if they pin you, the bust meter fills!';
}
function flash(t) { const f = $('flashmsg'); f.textContent = t; f.style.opacity = 1; flashT = 1.6; }
function hud() {
  $('h-score').textContent = Math.floor(scorePts);
  $('h-speed').textContent = Math.round(speed * 1.9);
  $('stars').textContent = '★'.repeat(wanted) + '☆'.repeat(5 - wanted);
  $('bust-fill').style.width = Math.min(100, bust) + '%';
  $('dmg-fill').style.width = Math.max(0, 100 - damage) + '%';
}
function over(kind) {
  state = 'over';
  $('restart').textContent = '▶ Chase again';
  if (kind === 'busted') { flash('🚔 BUSTED!'); $('msg').textContent = `🚔 BUSTED! The cops pinned you. Final score ${Math.floor(scorePts)} — ${Math.floor(dist)} m, wanted level ${wanted}.`; }
  else { flash('💥 WRECKED!'); $('msg').textContent = `💥 WRECKED! Your car gave out. Final score ${Math.floor(scorePts)} — ${Math.floor(dist)} m. Take fewer hits next run!`; }
  if (!submitted) { submitted = true; submitScore(Math.floor(scorePts)); }
}
function reset() {
  for (const t of traffic) scene.remove(t);
  for (const c of cops) scene.remove(c);
  traffic = []; cops = [];
  scorePts = 0; dist = 0; speed = 0; elapsed = 0; wanted = 0; bust = 0; damage = 0; trafficTimer = 0; submitted = false; shake = 0;
  player.position.set(0, 0, 0); player.rotation.set(0, 0, 0);
  state = 'wait';
  $('restart').textContent = '▶ Start chase';
  $('msg').textContent = "Weave through traffic — but the cops are coming. Don't let them box you in!";
  hud();
}
function start() { if (state === 'over') reset(); state = 'play'; $('restart').textContent = '↻ Restart'; }
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const now = performance.now();
  // cop light flashing
  const phase = Math.floor(now / 160) % 2 === 0;
  for (const c of cops) {
    if (c.userData.red) c.userData.red.material.color.setHex(phase ? 0xff2222 : 0x551111);
    if (c.userData.blue) c.userData.blue.material.color.setHex(phase ? 0x112255 : 0x2266ff);
  }
  if (flashT > 0) { flashT -= dt; if (flashT <= 0) $('flashmsg').style.opacity = 0; }
  if (state === 'play') {
    elapsed += dt;
    // speed
    const targetSpeed = keys.boost ? BOOST : keys.brake ? BRAKE : CRUISE;
    speed += (targetSpeed - speed) * Math.min(1, dt * (keys.brake ? 2.4 : 0.7));
    dist += speed * dt * 1.5;
    scorePts += speed * dt * 0.9;
    // steering
    const steerIn = (keys.left ? -1 : 0) + (keys.right ? 1 : 0);
    if (steerIn) player.position.x += steerIn * dt * (11 + speed * 0.16);
    if (keys.dragX !== undefined && keys.dragX !== null) player.position.x += (keys.dragX - player.position.x) * Math.min(1, dt * 9);
    player.position.x = Math.max(-ROAD_HALF, Math.min(ROAD_HALF, player.position.x));
    player.rotation.z = -steerIn * 0.05;
    player.rotation.y = -steerIn * 0.14;
    // wanted level + cop count
    const newWanted = Math.min(5, 1 + Math.floor(elapsed / 28));
    if (elapsed > 9 && newWanted !== wanted) { wanted = newWanted; flash('⭐ WANTED LEVEL ' + wanted); }
    if (elapsed > 9) {
      const wantCops = wanted <= 2 ? 1 : wanted === 3 ? 2 : 3;
      if (cops.length < wantCops) spawnCop();
    }
    // traffic spawning
    trafficTimer -= dt;
    if (trafficTimer <= 0) { trafficTimer = Math.max(0.55, 1.25 - elapsed / 90); spawnTraffic(); }
    // world scroll
    roadTex.offset.y += speed * dt / 42;
    for (const p of props) { p.position.z += speed * dt; if (p.position.z > 24) { p.position.z -= 420; p.position.x = (Math.random() < 0.5 ? -1 : 1) * (19 + Math.random() * 14); } }
    // traffic update
    for (const t of traffic) {
      t.position.z += (speed - t.userData.speed) * dt;
      // occasional lane change
      t.userData.changeT -= dt;
      if (t.userData.changeT <= 0) {
        t.userData.changeT = 4 + Math.random() * 7;
        const nx = LANES[Math.floor(Math.random() * LANES.length)];
        if (!traffic.some(o => o !== t && Math.abs(o.position.x - nx) < 3 && Math.abs(o.position.z - t.position.z) < 12)) t.userData.targetX = nx;
      }
      t.position.x += Math.sign(t.userData.targetX - t.position.x) * Math.min(Math.abs(t.userData.targetX - t.position.x), dt * 2.2);
      // near miss when overtaken
      if (!t.userData.passed && t.position.z > 3.4) {
        t.userData.passed = true;
        const gap = Math.abs(t.position.x - player.position.x);
        if (gap >= 2.0 && gap < 3.6 && speed > 26) { scorePts += 50; flash('😱 NEAR MISS +50'); }
      }
      // collision with player
      if (Math.abs(t.position.z) < 4.3 && Math.abs(t.position.x - player.position.x) < 1.95) {
        damage += 17; speed *= 0.42; shake = 0.5;
        t.position.x += (t.position.x < player.position.x ? -1 : 1) * 3.2;
        t.userData.targetX = t.position.x;
        flash('💥 CRASH! −health');
        if (damage >= 100) { renderer.render(scene, camera); return over('wrecked'); }
      }
    }
    traffic = traffic.filter(t => { if (t.position.z > 26 || t.position.z < -260) { scene.remove(t); return false; } return true; });
    // cops update
    let copClose = false;
    for (const c of cops) {
      const u = c.userData;
      const targetX = player.position.x;
      c.position.x += Math.sign(targetX - c.position.x) * Math.min(Math.abs(targetX - c.position.x), dt * 6.4 * u.aggro);
      u.lungeT = (u.lungeT === undefined ? 2 + Math.random() * 3 : u.lungeT) - dt;
      if (u.lungeT <= 0) { u.lunge = 1.1; u.lungeT = 3 + Math.random() * 3.5; }
      if (u.lunge > 0) u.lunge -= dt;
      const wantZ = u.lunge > 0 ? 3.9 : 6.2;
      const dz = c.position.z - wantZ;
      const copSpeed = speed + (dz > 0 ? 8.5 * u.aggro : -4);
      c.position.z += (speed - copSpeed) * dt;
      c.position.z = Math.max(3.2, Math.min(24, c.position.z));
      c.rotation.y = Math.sign(targetX - c.position.x) * -0.1;
      const d = Math.hypot(c.position.x - player.position.x, c.position.z - 6.2);
      if (d < 3.4) copClose = true;
      // ramming contact (only during a lunge does the cop actually reach your bumper)
      if (c.position.z < 4.8 && c.position.z > 2.6 && Math.abs(c.position.x - player.position.x) < 1.95) {
        bust += dt * 26; damage += dt * 3.5; shake = Math.max(shake, 0.25);
        player.position.x += (player.position.x < c.position.x ? -1 : 1) * dt * 3.5;
      }
    }
    // bust meter
    if (copClose && speed < 26) bust += dt * 15;
    else bust = Math.max(0, bust - dt * (copClose ? 2 : 7));
    if (bust >= 100) { renderer.render(scene, camera); return over('busted'); }
    if (damage >= 100) { renderer.render(scene, camera); return over('wrecked'); }
    hud();
  }
  // camera follow + shake
  const shX = shake > 0 ? (Math.random() - 0.5) * shake * 0.7 : 0;
  const shY = shake > 0 ? (Math.random() - 0.5) * shake * 0.5 : 0;
  shake = Math.max(0, shake - dt * 1.4);
  camera.position.x += ((player.position.x * 0.55) - camera.position.x) * Math.min(1, dt * 5);
  camera.position.x += shX; camera.position.y = 5.4 + shY;
  camera.lookAt(player.position.x * 0.7, 1, -12);
  player.position.y = shake > 0.2 ? Math.random() * 0.05 : 0;
  renderer.render(scene, camera);
}
// ---------- input ----------
addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
  if (e.key === 'ArrowUp' || e.key === 'w') keys.boost = true;
  if (e.key === 'ArrowDown' || e.key === 's') keys.brake = true;
  if (e.key === ' ' && state !== 'play') start();
});
addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
  if (e.key === 'ArrowUp' || e.key === 'w') keys.boost = false;
  if (e.key === 'ArrowDown' || e.key === 's') keys.brake = false;
});
function hold(id, key) {
  const el = $(id);
  const on = e => { e.preventDefault(); keys[key] = true; if (state !== 'play') start(); };
  const off = e => { e.preventDefault(); keys[key] = false; };
  el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off); el.addEventListener('pointerleave', off); el.addEventListener('pointercancel', off);
}
hold('t-left', 'left'); hold('t-right', 'right'); hold('t-boost', 'boost'); hold('t-brake', 'brake');
function initDrag() {
  const el = renderer.domElement;
  el.style.touchAction = 'none';
  el.addEventListener('pointerdown', e => { if (state !== 'play') start(); setDrag(e); });
  el.addEventListener('pointermove', e => { if (e.buttons) setDrag(e); });
  el.addEventListener('pointerup', () => keys.dragX = null);
  el.addEventListener('pointerleave', () => keys.dragX = null);
  function setDrag(e) {
    const r = el.getBoundingClientRect();
    const frac = (e.clientX - r.left) / r.width; // 0..1
    keys.dragX = (frac - 0.5) * 2 * (ROAD_HALF + 1.5);
  }
}
$('restart').onclick = () => { if (state === 'play') reset(); start(); };
// --- Site account (the Miner Cat account works everywhere) ---
let ME = null;
const esc = s => String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
async function loadLb() {
  try {
    const d = await (await fetch('/api/scores/pursuit3d')).json();
    $('lb').innerHTML = '<b>🏆 Leaderboard</b>' + (d.scores.length ? d.scores.map((s, i) => `<br>${i + 1}. ${esc(s.displayName)} — ${s.score}`).join('') : '<br>No scores yet — be the first!');
  } catch (e) {}
}
async function submitScore(s) {
  if (!ME || !s) return;
  try { await fetch('/api/scores', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ game: 'pursuit3d', score: s }) }); loadLb(); } catch (e) {}
}
(async () => {
  try { const r = await fetch('/api/me'); if (r.ok) ME = (await r.json()).user; } catch (e) {}
  $('acct').innerHTML = ME ? `👤 Playing as <b>${esc(ME.displayName)}</b> — your best score saves to your account` : '👤 <a href="/miner-cat-2" style="color:#f5c542;">Sign in</a> to save scores to your account';
  loadLb();
})();
if (window.THREE) { buildWorld(); reset(); initDrag(); animate(); }
</script>
<script src="/games/admin-panel.js"></script>
</body>
</html>
