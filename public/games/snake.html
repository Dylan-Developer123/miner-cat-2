<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Snake — Arqade</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #12121c; color: #eee; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 16px; }
  a.exit-game { display: inline-flex; align-items: center; align-self: flex-start; background: #26264a; color: #eee; border: 1px solid #55557a; border-radius: 9px; padding: 8px 14px; font-size: 15px; font-weight: 700; line-height: 1; text-decoration: none; }
  h1 { font-size: 26px; margin: 8px 0 4px; }
  #score { font-size: 18px; margin-bottom: 10px; }
  canvas { background: #0d2013; border: 2px solid #2c5c38; border-radius: 10px; touch-action: none; max-width: 92vw; }
  #msg { margin-top: 12px; font-size: 16px; min-height: 22px; }
  button { margin-top: 10px; background: #f5c542; color: #191920; border: none; font-weight: bold; padding: 10px 22px; border-radius: 9px; font-size: 16px; cursor: pointer; }
  .pad { display: grid; grid-template-columns: repeat(3, 58px); gap: 6px; margin-top: 14px; justify-content: center; }
  .pad button { margin: 0; padding: 12px 0; font-size: 20px; background: #26264a; color: #eee; }
</style>
</head>
<body>
<a class="exit-game" href="/">← All games</a>
<h1>🐍 Snake</h1>
<div id="score">Score: 0 · Best: 0</div>
<canvas id="c" width="400" height="400"></canvas>
<div id="msg">Press an arrow key, swipe, or tap a pad button to start</div>
<button id="restart">↻ Restart</button>
<div class="pad">
  <span></span><button data-d="up">▲</button><span></span>
  <button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button>
</div>
<div id="acct" style="margin-top:14px;font-size:14px;opacity:0.9;"></div>
<div id="lb" style="margin-top:10px;font-size:14px;text-align:left;min-width:250px;"></div>
<script>
const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
const N = 20, T = cvs.width / N;
let snake, dir, next, food, score, best = +(localStorage.getItem('snake-best') || 0), alive, timer;
function reset() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = { x: 1, y: 0 }; next = dir; score = 0; alive = false;
  placeFood(); draw(); upd();
  document.getElementById('msg').textContent = 'Press an arrow key, swipe, or tap a pad button to start';
  clearInterval(timer); timer = setInterval(tick, 110);
}
function placeFood() {
  do { food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; }
  while (snake.some(s => s.x === food.x && s.y === food.y));
}
function upd() { document.getElementById('score').textContent = `Score: ${score} · Best: ${best}`; }
function tick() {
  if (!alive) return;
  dir = next;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N || snake.some(s => s.x === head.x && s.y === head.y)) {
    alive = false;
    best = Math.max(best, score); localStorage.setItem('snake-best', best); upd();
    submitScore(score);
    document.getElementById('msg').textContent = `💀 Game over — score ${score}. Hit Restart!`;
    return;
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) { score += 10; placeFood(); upd(); }
  else snake.pop();
  draw();
}
function draw() {
  ctx.fillStyle = '#0d2013'; ctx.fillRect(0, 0, cvs.width, cvs.height);
  ctx.fillStyle = '#e33'; ctx.beginPath();
  ctx.arc(food.x * T + T / 2, food.y * T + T / 2, T / 2 - 2, 0, 7); ctx.fill();
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#8be26a' : '#4caf50';
    ctx.fillRect(s.x * T + 1, s.y * T + 1, T - 2, T - 2);
  });
}
function setDir(x, y) {
  if (dir.x === -x && dir.y === -y) return;
  next = { x, y }; alive = true;
}
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
addEventListener('keydown', e => {
  const k = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' }[e.key];
  if (k) { e.preventDefault(); setDir(...DIRS[k]); }
});
document.querySelectorAll('.pad button').forEach(b =>
  b.addEventListener('pointerdown', e => { e.preventDefault(); setDir(...DIRS[b.dataset.d]); }));
let tx, ty;
cvs.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
cvs.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) < 12 && Math.abs(dy) < 12) return;
  if (Math.abs(dx) > Math.abs(dy)) setDir(Math.sign(dx), 0); else setDir(0, Math.sign(dy));
}, { passive: true });
document.getElementById('restart').onclick = reset;
// --- Site account (the Miner Cat account works everywhere) ---
let ME = null;
const esc = s => String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
async function loadLb() {
  try {
    const d = await (await fetch('/api/scores/snake')).json();
    document.getElementById('lb').innerHTML = '<b>🏆 Leaderboard</b>' +
      (d.scores.length ? d.scores.map((s, i) => `<br>${i + 1}. ${esc(s.displayName)} — ${s.score}`).join('') : '<br>No scores yet — be the first!');
  } catch (e) {}
}
async function submitScore(s) {
  if (!ME || !s) return;
  try {
    await fetch('/api/scores', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ game: 'snake', score: s }) });
    loadLb();
  } catch (e) {}
}
(async () => {
  try { const r = await fetch('/api/me'); if (r.ok) ME = (await r.json()).user; } catch (e) {}
  document.getElementById('acct').innerHTML = ME
    ? `👤 Playing as <b>${esc(ME.displayName)}</b> — your best score saves to your account`
    : '👤 <a href="/miner-cat-2" style="color:#f5c542;">Sign in</a> to save scores to your account';
  loadLb();
})();
reset();
</script>
<script src="/games/admin-panel.js"></script>
</body>
</html>
